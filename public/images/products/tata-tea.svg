  <path d="M66 76 Q65 72 67 69" stroke="#FEF08A" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M73 75 Q72 71 74 68" stroke="#FEF08A" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- 500g badge -->
  <rect x="55" y="104" width="30" height="8" rx="2" fill="#FEF08A" />
  <text x="70" y="110.5" font-family="monospace" font-size="6" font-weight="bold" fill="#14532D" text-anchor="middle">500g</text>
