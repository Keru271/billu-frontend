      <stop offset="0%" stop-color="#DCFCE7" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>
    <linearGradient id="teaPack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>
  <rect width="140" height="140" rx="16" fill="url(#bgTea)" />
  <!-- Tea Pouch Packet -->
  <path d="M36 24 C36 20 104 20 104 24 L100 116 C100 120 40 120 40 116 Z" fill="url(#teaPack)" stroke="#052E16" stroke-width="2" />
