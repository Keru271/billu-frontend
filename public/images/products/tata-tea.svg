  <text x="70" y="44" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TATA</text>
  <!-- TEA PREMIUM -->
  <text x="70" y="58" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#FEF08A" text-anchor="middle">TEA</text>
  <text x="70" y="66" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="#FACC15" text-anchor="middle" letter-spacing="1">PREMIUM</text>
  <!-- Desh Ki Chai Leaf Banner -->
  <ellipse cx="70" cy="84" rx="18" ry="12" fill="#F59E0B" opacity="0.9" />
