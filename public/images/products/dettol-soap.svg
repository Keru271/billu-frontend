<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="bgDettol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="dettolGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <rect width="140" height="140" rx="16" fill="url(#bgDettol)" />
  <!-- Soap Pack Box -->
  <rect x="28" y="34" width="84" height="72" rx="10" fill="url(#dettolGreen)" stroke="#065F46" stroke-width="2" />
  <!-- Center White Shield Badge -->
  <path d="M50 44 L90 44 L90 70 C90 82 70 90 70 90 C70 90 50 82 50 70 Z" fill="#FFFFFF" />
  <!-- Dettol Sword / Cross Crest -->
  <path d="M70 48 L70 78" stroke="#047857" stroke-width="3" stroke-linecap="round" />
  <path d="M62 56 L78 56" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="70" cy="56" r="3.5" fill="#047857" />
  <!-- Dettol Text -->
  <text x="70" y="85" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#047857" text-anchor="middle">Dettol</text>
  <!-- Pack of 3 ribbon -->
  <rect x="36" y="94" width="68" height="9" rx="2" fill="#F59E0B" />
  <text x="70" y="100.5" font-family="system-ui, sans-serif" font-size="5.5" font-weight="bold" fill="#065F46" text-anchor="middle">PACK OF 3 (125g each)</text>
</svg>
